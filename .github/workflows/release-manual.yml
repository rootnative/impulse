name: Release (manual)

# **This filename is part of the release credentials. Do not rename it.**
#
# npm binds a trusted publisher to an exact `owner/repo` plus an exact
# workflow filename. This is the only workflow that publishes
# @rootnative/impulse, and it must stay registered on npmjs.com. A rename
# revokes nothing and warns about nothing: the run dies at the publish step
# with npm's auth-as-404 (`404 PUT /@rootnative%2fimpulse`), after every gate
# has passed. `rootnative/ui` lost a release to exactly that. A new publishing
# workflow needs its own registration before its first run.
#
# ## Who does what
#
# A human writes the `## [<version>] - <date>` CHANGELOG section, commits it to
# main, and dispatches this workflow from main. This workflow does the rest:
# it bumps packages/core/package.json, repairs every version reference,
# regenerates the llms files, runs the gates on the result, commits
# `release: core@<version>`, tags it, pushes both, stages the publish on npm,
# creates the GitHub Release, and redeploys the docs.
#
# `check:versions` fails when the CHANGELOG has no section for the new version,
# so a forgotten release note stops the run before anything is pushed. The
# full sequence, and what to do when a step fails, is in RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump type (ignored if custom_version is set)."
        required: false
        default: skip
        type: choice
        options:
          - skip
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      custom_version:
        description: 'Exact version, e.g. "0.0.1" or "0.0.0-alpha.3". Overrides the bump type.'
        required: false
        type: string
      preid:
        description: "Prerelease identifier (alpha, beta, rc). Used only with the pre* bump types."
        required: false
        default: alpha
        type: string
      tag:
        description: "npm dist-tag."
        required: true
        default: latest
        type: choice
        options:
          - latest
          - alpha
          - beta
          - rc
      dry_run:
        description: "Bump, run every gate, and commit in the runner, but push, tag, and publish nothing."
        required: false
        default: false
        type: boolean

# `contents: write` pushes the release commit and the tag and creates the
# GitHub Release. `id-token: write` mints the OIDC token npm exchanges for
# publish rights. `actions: write` dispatches the docs deploy.
permissions:
  contents: write
  id-token: write
  actions: write

# No `cancel-in-progress`. A cancelled publish can leave a version on npm with
# no tag in git, and an npm version cannot be republished.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release @rootnative/impulse
    runs-on: ubuntu-latest
    steps:
      # The release commit is pushed to main, so the tree it is built from has
      # to be main. A dispatch from another branch would push that branch's
      # tree onto main.
      - name: Require main
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Dispatch this workflow from main. It pushes the release commit to main."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are needed to prove this version has not already been cut.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          # Required even under trusted publishing: the OIDC token is
          # exchanged at a registry, and this is what names it.
          registry-url: https://registry.npmjs.org

      # Pinned to an exact version, not a range, and matching the pin in
      # `rootnative/inertia`. An unpinned upgrade silently re-versions the
      # release path on every run: in inertia, `npm version <same-version>`
      # was a no-op through one release and a hard error two days later, which
      # broke the next two attempts with no change in the repository. Bump
      # this on purpose, in its own commit.
      - name: Install npm (staged publishing requires >=11.15.0)
        run: npm install -g npm@11.19.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Inputs reach the shell through `env`, never through `${{ }}` inside
      # `run`, so a crafted version string cannot inject a command.
      - name: Bump the version
        id: version
        working-directory: packages/core
        env:
          BUMP: ${{ inputs.version }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          PREID: ${{ inputs.preid }}
        run: |
          if [ -n "$CUSTOM_VERSION" ]; then
            if ! echo "$CUSTOM_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::custom_version must be bare semver, like 0.0.1 or 0.0.0-alpha.3 — no 'v' prefix."
              exit 1
            fi
            # `--allow-same-version` is the recovery path: when a run pushed
            # the release commit and then failed to publish, the next run is
            # dispatched with the same custom_version, finds the tree already
            # bumped, and publishes it.
            npm version "$CUSTOM_VERSION" --no-git-tag-version --allow-same-version
          elif [ "$BUMP" = "skip" ]; then
            echo "::error::Set custom_version or pick a bump type."
            exit 1
          else
            case "$BUMP" in
              pre*) npm version "$BUMP" --preid "$PREID" --no-git-tag-version ;;
              *) npm version "$BUMP" --no-git-tag-version ;;
            esac
          fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Is publishing this version, now, to this dist-tag the thing that was
      # meant? npm version, the bumped version, the tag not already existing,
      # and the dist-tag suiting the version.
      - name: Check the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ inputs.tag }}
        run: node scripts/check-release.mjs --version "$VERSION" --dist-tag "$DIST_TAG"

      # Before `build:llms`: `llms-full.txt` is generated from the roadmap page
      # and the package `llms.txt` is a copy of the docs one, so generating
      # first would ship the previous version in both.
      - name: Sync version references
        run: pnpm run check:versions:fix

      - name: Regenerate the llms files
        run: pnpm run build:llms

      # Preflight runs this again, but only after lint, typecheck, test, and
      # build. A missing CHANGELOG section should fail in seconds, not minutes.
      - name: Verify version references
        run: pnpm run check:versions

      # The same gate list `pnpm run preflight` runs locally and `ci-build`
      # runs on a pull request: format, lint, typecheck, test, build,
      # check:versions, check:llms, check:artifact. It runs on the bumped tree,
      # so the gates check exactly what is committed and published. There is
      # deliberately no input that skips it.
      - name: Preflight
        run: pnpm run preflight

      - name: Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Every file `check:versions:fix` and `build:llms` can rewrite.
          git add packages/core/package.json packages/core/CHANGELOG.md \
            packages/core/README.md packages/core/llms.txt README.md \
            docs/docs/roadmap.md docs/static/llms.txt docs/static/llms-full.txt
          # A file rewritten above but missing from that list would be left
          # out of the commit, and CI on main would fail right after the push.
          if ! git diff --quiet; then
            echo "::error::The release left changes outside the commit list:"
            git status --short
            exit 1
          fi
          # Nothing is staged on the recovery path, where the tree was already
          # bumped. The tag still has to be cut, so only the commit is skipped.
          git diff --cached --quiet || git commit -m "release: core@$VERSION"
          git tag "core@$VERSION"

      # Push BEFORE publishing. A push can be rejected — main moved during the
      # run, a token without the right scope — and an npm publish can never be
      # undone. `--atomic` lands the commit and the tag together or neither.
      - name: Push the release commit and tag
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git push --atomic origin HEAD:refs/heads/main "refs/tags/core@$VERSION"

      # No `NODE_AUTH_TOKEN`, and none should be added. This path is OIDC
      # only: if npm will not authenticate it, register this workflow as a
      # trusted publisher rather than park a standing credential that silently
      # takes precedence over it.
      # Staged, not direct. The trusted publisher on npmjs.com is restricted
      # to stage-only, so a plain `npm publish` from here is rejected. `npm
      # stage publish` uploads the tarball with provenance and holds it;
      # nothing is installable until a maintainer approves it with 2FA. The
      # dist-tag is fixed at stage time and cannot change at approval.
      - name: Stage the publish on npm
        if: ${{ !inputs.dry_run }}
        working-directory: packages/core
        env:
          DIST_TAG: ${{ inputs.tag }}
        run: npm stage publish --provenance --access public --tag "$DIST_TAG"

      # npm answers an unauthorized publish with a 404, so the default failure
      # says the package does not exist rather than that the credentials are
      # wrong. Say the real thing.
      - name: Explain a publish failure
        if: ${{ failure() && !inputs.dry_run }}
        run: |
          echo "::error::If the publish failed with a 404 on PUT /@rootnative%2fimpulse, it is almost certainly authentication, not a missing package."
          echo "Check, in order:"
          echo "  1. Is '.github/workflows/release-manual.yml' registered as a trusted publisher for @rootnative/impulse on npmjs.com? npm binds to the exact filename."
          echo "  2. Does the job still have 'id-token: write'?"
          echo "  3. Did the step run plain 'npm publish'? The publisher is stage-only on npmjs.com and rejects it. This workflow must call 'npm stage publish'."
          echo "If the release commit and tag were already pushed, see 'When a run fails' in RELEASING.md."

      - name: Create the GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "core@$VERSION" --title "$VERSION" --generate-notes $prerelease

      # A push made with GITHUB_TOKEN starts no workflow, so the release commit
      # would not reach the docs site until the next human push. A dispatch is
      # the one event this token may start.
      - name: Redeploy the docs
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-web.yml --ref main

      - name: Summary
        if: ${{ always() }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ inputs.tag }}
          DRY: ${{ inputs.dry_run }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            if [ "$JOB_STATUS" != "success" ]; then
              echo "### Release \`${VERSION:-?}\` failed"
              echo ""
              echo "See 'When a run fails' in RELEASING.md for what was released and what to do."
            elif [ "$DRY" = "true" ]; then
              echo "### Dry run — nothing was pushed or published"
              echo ""
              echo "Every gate passed on the bumped tree. This is the commit a real run pushes:"
              echo ""
              echo '```'
              git show --stat --format='%s' HEAD
              echo '```'
            else
              echo "### Staged \`$VERSION\` — not live yet"
              echo ""
              echo "- npm: \`@rootnative/impulse@$VERSION\` is staged for dist-tag \`$DIST_TAG\`. Approve it with 2FA on npmjs.com (Staged Packages) or with \`npm stage approve\`. Nothing is installable until then."
              echo "- Commit: \`release: core@$VERSION\` on main"
              echo "- Tag: \`core@$VERSION\`"
              echo "- Docs: deploy dispatched"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
